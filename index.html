<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;125,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D stage, one floating control/spec panel (left on desktop, bottom sheet on phone). */
:root {
  --stage: #e6ecee;
  --panel: rgba(248, 251, 251, 0.88);
  --panel-solid: #f8fbfb;
  --ink: #13202a;
  --muted: #566672;
  --line: #c9d4d8;
  --accent: #8a5d0c;
  --accent-fill: #c8962e;
  --on-accent: #1d1406;
  --blood: #a8241c;
  --ble: #2462d6;
  --chip-bg: rgba(255, 255, 255, 0.9);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #0d1316; --panel: rgba(18, 26, 30, 0.88); --panel-solid: #121a1e;
    --ink: #e4ebee; --muted: #93a4ae; --line: #2a3840;
    --accent: #e3b456; --accent-fill: #d6a440; --on-accent: #1d1406;
    --blood: #f0695d; --ble: #79a8ff; --chip-bg: rgba(18, 26, 30, 0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #0d1316; --panel: rgba(18, 26, 30, 0.88); --panel-solid: #121a1e;
  --ink: #e4ebee; --muted: #93a4ae; --line: #2a3840;
  --accent: #e3b456; --accent-fill: #d6a440; --on-accent: #1d1406;
  --blood: #f0695d; --ble: #79a8ff; --chip-bg: rgba(18, 26, 30, 0.9);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--stage); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  overflow: hidden;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl {
  position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 11px; line-height: 1.25; white-space: nowrap;
  color: var(--ink); transition: opacity .25s;
}
.lbl i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-fill); box-shadow: 0 0 0 2px var(--chip-bg); flex: none; }
.lbl b { font-weight: 500; background: var(--chip-bg); border: 1px solid var(--line); padding: 2px 6px; border-radius: 3px; }
.lbl small { display: block; color: var(--muted); font-size: 10px; }
.lbl.left { flex-direction: row-reverse; }
.lbl.dim { opacity: .28; }

#panel {
  position: fixed; z-index: 2;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  width: 320px; max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow: auto; background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 16px; display: flex; flex-direction: column; gap: 14px;
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 {
  margin: 0; font-family: var(--font-display); font-stretch: 125%; font-weight: 700;
  font-size: 26px; letter-spacing: -0.01em; line-height: 1;
}
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--muted); font-size: 12px; }
.eyebrow {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  margin: 0 0 6px;
}
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--stage); padding: 3px; border-radius: 7px; border: 1px solid var(--line); }
.seg button, .pill button, .btn {
  font: inherit; font-size: 12px; color: var(--ink); background: transparent; border: 0; border-radius: 5px;
  padding: 7px 4px; cursor: pointer; font-weight: 500;
}
.seg button[aria-pressed="true"], .pill button[aria-pressed="true"] { background: var(--panel-solid); box-shadow: 0 1px 2px rgba(0,0,0,.12); color: var(--accent); }
.seg button:focus-visible, .pill button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent-fill); outline-offset: 1px; }
.ctrls { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 10px; }
.row label, .row .k { font-size: 12px; color: var(--muted); }
.pill { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; background: var(--stage); padding: 3px; border-radius: 6px; border: 1px solid var(--line); }
input[type="range"] { width: 100%; accent-color: var(--accent-fill); }
.checks { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.checks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); padding: 8px 12px; background: var(--panel-solid); }
.btn.primary { background: var(--blood); border-color: var(--blood); color: #fff; }
.btn[disabled] { opacity: .45; cursor: default; }
.spec h2 { margin: 0 0 6px; font-family: var(--font-display); font-stretch: 112%; font-weight: 600; font-size: 15px; text-wrap: balance; }
.spec dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 12px; }
.spec dt { font-family: var(--font-mono); font-size: 10.5px; color: var(--accent); padding-top: 1px; text-transform: uppercase; letter-spacing: .06em; }
.spec dd { margin: 0; min-width: 0; }
.foot { font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
#hint {
  position: fixed; z-index: 1; font-family: var(--font-mono); font-size: 11px; color: var(--muted);
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
}
@media (max-width: 720px) {
  #panel {
    top: auto; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
    bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 44%;
    padding: 12px; gap: 10px;
  }
  .brand h1 { font-size: 20px; }
  #hint { display: none; }
  .lbl { font-size: 10px; }
  .lbl small { display: none; }
}
@media (prefers-reduced-motion: reduce) { .lbl { transition: none; } }
</style>

<div id="stage"><div id="labels" aria-hidden="true"></div></div>

<aside id="panel" aria-label="Controlli modello">
  <div class="brand">
    <h1>Gra<span>He</span>aL</h1>
    <p>Diagnostica Point-of-Care su GFET · cartuccia monouso + lettore portatile</p>
  </div>

  <div>
    <p class="eyebrow">Vista</p>
    <div class="seg" role="group" aria-label="Vista">
      <button id="v-assembled" data-view="assembled" aria-pressed="true">Insieme</button>
      <button id="v-chip" data-view="chip" aria-pressed="false">Chip</button>
      <button id="v-cut" data-view="cut" aria-pressed="false">Spaccato</button>

  <div class="ctrls">
    <div class="row">
      <span class="k">Substrato</span>
      <div class="pill" role="group" aria-label="Substrato">
        <button id="s-pla" data-sub="pla" aria-pressed="true">PLA</button>
        <button id="s-cel" data-sub="cel" aria-pressed="false">Cellulosa</button>
      </div>
    </div>
    <div class="row"><label for="flex">Flessione</label><input id="flex" type="range" min="0" max="1" step="0.01" value="0.55"></div>
    <div class="row"><label for="explode">Esploso</label><input id="explode" type="range" min="0" max="1" step="0.01" value="0"></div>
    <div class="checks">
      <label><input id="opt-labels" type="checkbox" checked> Etichette</label>
      <label><input id="opt-rotate" type="checkbox"> Rotazione</label>
    </div>
    <div class="actions">
      <button id="btn-test" class="btn primary">Inocula goccia e misura</button>
      <button id="btn-glb" class="btn" hidden>Esporta .glb</button>
    </div>
  </div>

  <section class="spec" id="spec" aria-live="polite"></section>
  <p class="foot">Modello illustrativo: le dimensioni del lettore sono indicative e le scale nano/macro sono separate.</p>
</aside>
<div id="hint">trascina per ruotare · rotella/pinch per zoom · tasto destro per spostare</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const V3 = THREE.Vector3, V2 = THREE.Vector2;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ------------------------------------------------------------------ renderer */
const stageEl = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
stageEl.prepend(renderer.domElement);

const macro = new THREE.Scene();
const nanoScene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
macro.environment = envTex; nanoScene.environment = envTex;

const camera = new THREE.PerspectiveCamera(34, 1, 0.3, 4000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.autoRotateSpeed = 0.8;

function applyThemeBg() {
  const c = new THREE.Color(css('--stage') || '#e6ecee');
  macro.background = c; nanoScene.background = c.clone();
}
applyThemeBg();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyThemeBg);
new MutationObserver(applyThemeBg).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ------------------------------------------------------------------ helpers */
function canvasTex(w, h, draw, repeat = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.userData.ctx = ctx; t.userData.canvas = c;
  return t;
}
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// rounded rectangle outline, CCW, starting at (+w/2, 0)
function rrPoints(w, h, r, seg = 12) {
  const hw = w / 2, hh = h / 2, pts = [new V2(hw, 0)];
  const cs = [[hw - r, hh - r, 0], [-hw + r, hh - r, 90], [-hw + r, -hh + r, 180], [hw - r, -hh + r, 270]];
  for (const [cx, cy, a0] of cs) for (let i = 0; i <= seg; i++) {
    const a = THREE.MathUtils.degToRad(a0 + 90 * i / seg);
    pts.push(new V2(cx + r * Math.cos(a), cy + r * Math.sin(a)));
  }
  return pts;
}
// extrude a 2D outline (in XZ plan view) upward along +Y between y0 and y0+h
function extrudeUp(shape, y0, h, opts = {}) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 16, ...opts });
  g.rotateX(-Math.PI / 2); g.translate(0, y0, 0); return g;
}
function ringShape(w, h, r, t) {
  const s = new THREE.Shape(rrPoints(w, h, r));
  s.holes.push(new THREE.Path(rrPoints(w - 2 * t, h - 2 * t, Math.max(r - t, 0.5)).reverse()));
  return s;
}
// ring with a gap on the +X side (the cartridge slot)
function cRingShape(w, h, r, t, gap) {
  const o = rrPoints(w, h, r), i = rrPoints(w - 2 * t, h - 2 * t, r - t);
  const hw = w / 2, hwi = w / 2 - t;
  const outer = [new V2(hw, gap / 2), ...o.slice(1), new V2(hw, -gap / 2)];
  const inner = [new V2(hwi, gap / 2), ...i.slice(1), new V2(hwi, -gap / 2)].reverse();
  return new THREE.Shape([...outer, ...inner]);
}
function boxAt(w, h, d, x, y, z, segX = 1, segZ = 1) {
  const g = new THREE.BoxGeometry(w, h, d, segX, 1, segZ); g.translate(x, y, z); return g;
}
// box from x0..x1, y0..y1, z0..z1 with segments along X for bending
function boxXYZ(x0, x1, y0, y1, z0, z1, segLen = 0.6) {
  const w = x1 - x0, d = z1 - z0;
  return boxAt(w, y1 - y0, d, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2, Math.max(1, Math.ceil(w / segLen)), Math.max(1, Math.ceil(d / 2)));
}
function mesh(geo, mat, parent, name) {
  const m = new THREE.Mesh(geo, mat); if (name) m.name = name; if (parent) parent.add(m); return m;
}

/* ------------------------------------------------------------------ materials */
const MAT = {
  gold: new THREE.MeshStandardMaterial({ color: 0xf3c35f, metalness: 1, roughness: 0.2 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xbfc5cc, metalness: 1, roughness: 0.16 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xc9ced3, metalness: 1, roughness: 0.32 }),
  black: new THREE.MeshStandardMaterial({ color: 0x15181b, roughness: 0.55 }),
  blackGloss: new THREE.MeshPhysicalMaterial({ color: 0x0c0e10, roughness: 0.2, clearcoat: 1 }),
  void: new THREE.MeshBasicMaterial({ color: 0x050607, side: THREE.BackSide }),
  pla: new THREE.MeshPhysicalMaterial({ color: 0xf1e4c8, roughness: 0.32, transmission: 0.55, thickness: 0.4, ior: 1.46, clearcoat: 0.4 }),
  lid: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.08, transmission: 0.92, thickness: 0.3, ior: 1.46, transparent: true, opacity: 0.9 }),
  passiv: new THREE.MeshPhysicalMaterial({ color: 0x6fa8d6, roughness: 0.25, transmission: 0.45, transparent: true, opacity: 0.72, thickness: 0.1 }),
  blood: new THREE.MeshPhysicalMaterial({ color: 0x8e0f12, roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.04, transmission: 0.18, thickness: 1.5, ior: 1.36, sheen: 0.3, sheenColor: 0xff6a5a }),
};
// cellulose: matte fibrous paper look
const fiberTex = canvasTex(512, 512, (c, w, h) => {
  c.fillStyle = '#f4f1ea'; c.fillRect(0, 0, w, h); const r = rng(7);
  for (let i = 0; i < 1600; i++) {
    c.strokeStyle = `rgba(${150 + r() * 60},${140 + r() * 60},${120 + r() * 50},${0.10 + r() * 0.14})`;
    c.lineWidth = 0.6 + r() * 1.2; c.beginPath();
    const x = r() * w, y = r() * h, a = r() * Math.PI, l = 10 + r() * 40;
    c.moveTo(x, y); c.quadraticCurveTo(x + Math.cos(a + .4) * l / 2, y + Math.sin(a + .4) * l / 2, x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
  }
}, true);
fiberTex.repeat.set(3, 1);
MAT.cel = new THREE.MeshStandardMaterial({ color: 0xffffff, map: fiberTex, roughness: 0.93 });

/* ------------------------------------------------------------------ textures */
// graphene honeycomb (stylised: real lattice is 0.246 nm, here shown as a visible pattern)
const grapheneTex = canvasTex(1024, 512, (c, w, h) => {
  const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#2b3036'); g.addColorStop(1, '#3a4148');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const s = 9, dx = Math.sqrt(3) * s;
  c.strokeStyle = 'rgba(190,205,215,0.55)'; c.lineWidth = 1.3;
  for (let row = -1; row * 1.5 * s < h + s; row++) for (let col = -1; col * dx < w + dx; col++) {
    const cx = col * dx + (row % 2 ? dx / 2 : 0), cy = row * 1.5 * s;
    c.beginPath();
    for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; const px = cx + s * Math.cos(a), py = cy + s * Math.sin(a); k ? c.lineTo(px, py) : c.moveTo(px, py); }
    c.closePath(); c.stroke();
  }
  c.fillStyle = 'rgba(220,235,245,0.75)';
  for (let row = -1; row * 1.5 * s < h + s; row++) for (let col = -1; col * dx < w + dx; col++) {
    const cx = col * dx + (row % 2 ? dx / 2 : 0), cy = row * 1.5 * s;
    for (let k = 0; k < 6; k += 2) { const a = Math.PI / 6 + k * Math.PI / 3; c.fillRect(cx + s * Math.cos(a) - 1.2, cy + s * Math.sin(a) - 1.2, 2.4, 2.4); }
  }
});
// receptor speckle for the functionalised channel
const receptorTex = canvasTex(512, 256, (c, w, h) => {
  c.clearRect(0, 0, w, h); const r = rng(42);
  for (let i = 0; i < 900; i++) {
    const x = r() * w, y = r() * h;
    c.fillStyle = r() > 0.5 ? 'rgba(242,155,56,0.9)' : 'rgba(80,200,170,0.9)';
    c.beginPath(); c.arc(x, y, 1.6 + r() * 1.4, 0, 7); c.fill();
  }
});

/* ------------------------------------------------------------------ labels */
const labelLayer = document.getElementById('labels');
const labels = [];
function addLabel(title, sub, view, getPos, opts = {}) {
  const el = document.createElement('div'); el.className = 'lbl' + (opts.left ? ' left' : '');
  el.innerHTML = `<i></i><b>${title}${sub ? `<small>${sub}</small>` : ''}</b>`;
  labelLayer.appendChild(el);
  labels.push({ el, view: Array.isArray(view) ? view : [view], getPos, occlude: opts.occlude });
}

/* ================================================================== CHIP */
const CH = { L: 40, W: 14, T: 0.25 };
const chip = new THREE.Group(); chip.name = 'GraHeaL_Cartuccia'; macro.add(chip);
const layerNames = ['substrato', 'grafene', 'cromo', 'oro', 'biostrato', 'fluido', 'coperchio'];
const layers = layerNames.map((n) => { const g = new THREE.Group(); g.name = 'layer_' + n; chip.add(g); return g; });
const bendables = [];
function bendable(g) { g.userData.base = g.attributes.position.array.slice(); bendables.push(g); return g; }
const BEND_AMP = 3.4;
const bendY = (x, k) => { const u = (x - CH.L / 2) / (CH.L / 2); return k * BEND_AMP * u * u; };
function applyBend(k) {
  for (const g of bendables) {
    const a = g.attributes.position.array, b = g.userData.base;
    for (let i = 0; i < a.length; i += 3) a[i + 1] = b[i + 1] + bendY(b[i], k);
    g.attributes.position.needsUpdate = true; g.computeVertexNormals(); g.computeBoundingSphere(); g.computeBoundingBox();
  }
}

// substrate
const substrate = mesh(bendable(boxXYZ(0, CH.L, -CH.T, 0, -CH.W / 2, CH.W / 2, 0.5)), MAT.pla, layers[0], 'substrato_biopolimero');
// printed graphics on substrate
const printTex = canvasTex(1600, 560, (c, w, h) => {
  const px = w / CH.L; // px per mm ; canvas x = chip x, canvas y = z + W/2 (top = -z)
  const X = (x) => x * px, Y = (z) => (z + CH.W / 2) * px;
  c.clearRect(0, 0, w, h);
  c.fillStyle = '#2a3036';
  c.font = `600 ${0.95 * px}px Archivo, Arial, sans-serif`; c.textBaseline = 'middle';
  c.fillText('GraHeaL', X(31.2), Y(-5.6));
  c.font = `${0.5 * px}px "IBM Plex Mono", monospace`;
  c.fillText('GFET · LOT 26A-0412', X(31.2), Y(-4.6));
  c.fillStyle = '#2a3036';
  c.font = `500 ${0.62 * px}px "IBM Plex Mono", monospace`;
  c.fillText('ACT', X(8.5), Y(6.3)); c.fillText('REF', X(8.5), Y(-6.3));
  // insertion arrow
  c.strokeStyle = '#2a3036'; c.lineWidth = 0.12 * px; c.beginPath();
  c.moveTo(X(16.5), Y(6.3)); c.lineTo(X(12.2), Y(6.3)); c.moveTo(X(12.9), Y(5.9)); c.lineTo(X(12.2), Y(6.3)); c.lineTo(X(12.9), Y(6.7)); c.stroke();
  c.beginPath(); c.moveTo(X(16.5), Y(-6.3)); c.lineTo(X(12.2), Y(-6.3)); c.moveTo(X(12.9), Y(-5.9)); c.lineTo(X(12.2), Y(-6.3)); c.lineTo(X(12.9), Y(-6.7)); c.stroke();
  // drop icon + "1 goccia"
  c.fillStyle = '#a8241c'; c.beginPath();
  const dx = X(32), dy = Y(5.4), r = 0.55 * px;
  c.moveTo(dx, dy - r * 1.9); c.quadraticCurveTo(dx + r * 1.1, dy - r * 0.4, dx + r, dy + r * 0.1); c.arc(dx, dy + r * 0.1, r, 0, Math.PI); c.quadraticCurveTo(dx - r * 1.1, dy - r * 0.4, dx, dy - r * 1.9); c.fill();

addLabel('Drain · Au/Cr', '', 'chip', chipPt(3, 28.6, 0.05, 2.0));

addLabel('Contatti al lettore', 'S · D · G ×2', 'chip', chipPt(3, 3.5, 0.05, 0.5), { left: true });
addLabel('Canale microfluidico', 'coperchio trasparente', 'chip', chipPt(6, 31.5, 0.62, -3.2));

addLabel('SoC Microcontrollore', 'MCU + radio BLE integrata', 'cut', W(-9, pcbTop + 1.1, 12, gInside));
addLabel('Modulo DSP', 'filtri + amplificatore lock-in', 'cut', W(12, pcbTop + 2.2, 15, gInside));
addLabel('AFE amperometrico/potenziometrico', 'TIA · ADC 24 bit', 'cut', W(33, pcbTop + 1, 9, gInside));
addLabel('Connettore cartuccia J1', 'molle sui pad S/D/G', 'cut', W(48, 15, 1, gInside));
addLabel('Batteria Li-Po', '', 'cut', W(-34, pcbTop + 6, 18, gInside), { left: true });
addLabel('Antenna BLE 2.4 GHz', 'meandro su PCB', 'cut', W(-14, pcbTop + 0.1, 24, gInside));

addLabel('Grafene monostrato', 'reticolo esagonale sp² · C–C 0,142 nm', 'nano', W(20, 0.6, 16, nano));
addLabel('Linker PBASE', 'pirene impilato π–π a 0,34 nm', 'nano', () => { const s = sites[2]; return new V3(s[0], 4, s[1]); });
addLabel('Estere NHS', 'PBASE non ancora accoppiato', 'nano', () => { const s = sites[4]; return pb[4].top.clone(); });
addLabel(`Aptamero ssDNA · ${(dimH / 10).toFixed(1)} × ${(dimW / 10).toFixed(1)} nm`, 'recettore ultracompatto < 2 nm', 'nano', () => new V3(dimApt.bb.max.x + 3.5, (dimApt.bb.min.y + dimApt.bb.max.y) / 2, (dimApt.bb.min.z + dimApt.bb.max.z) / 2));
addLabel('Biomarcatore legato', '', 'nano', () => bound.position.clone().add(new V3(3, 1, 0)));
addLabel('Biomarcatore libero', 'nel plasma', 'nano', () => freeTargets[1].position.clone().add(new V3(7, 0, 0)));
addLabel('Elettrodo Source Au/Cr', '', 'nano', W(-GX + 2, 9, -GZ, nano), { left: true });
addLabel('1 nm', '', 'nano', W(-15, 1.2, GZ + 3.5, nano));

/* ================================================================== display UI (canvas) */
const disp = { state: 'ready', t0: 0, p: 0, last: 0 };
function drawDisplay(now) {
  const c = dispCanvasTex.userData.ctx, w = 1000, h = 760;
  c.fillStyle = '#061015'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#e8eef1'; c.font = '700 54px Archivo, Arial, sans-serif'; c.textBaseline = 'middle';
  c.fillText('GraHeaL', 40, 60);
  // BLE + battery
  const ble = disp.state === 'acq' ? (Math.sin(now / 150) > 0 ? '#5d95ff' : '#20406f') : '#5d95ff';
  c.strokeStyle = ble; c.lineWidth = 7; c.lineJoin = 'round'; const bx = 820, by = 60, s = 18;
  c.beginPath(); c.moveTo(bx - s * .7, by - s * .7); c.lineTo(bx + s * .7, by + s * .7); c.lineTo(bx, by + s * 1.4); c.lineTo(bx, by - s * 1.4); c.lineTo(bx + s * .7, by - s * .7); c.lineTo(bx - s * .7, by + s * .7); c.stroke();
  c.strokeStyle = '#a9b6bd'; c.lineWidth = 4; c.strokeRect(870, 42, 90, 38); c.fillStyle = '#5fd39b'; c.fillRect(876, 48, 64, 26); c.fillStyle = '#a9b6bd'; c.fillRect(962, 52, 8, 18);
  c.fillStyle = '#1b2a32'; c.fillRect(40, 108, w - 80, 3);
  const msg = { idle: 'Inserire la cartuccia', ready: 'Cartuccia GFET rilevata · inoculare 1 goccia', acq: 'Acquisizione · lock-in differenziale', done: 'Misura completata · dati inviati via BLE' }[disp.state];
  c.fillStyle = '#c8d4da'; c.font = '500 34px "IBM Plex Sans", sans-serif'; c.fillText(msg, 40, 150);
  // plot
  const X0 = 70, X1 = w - 40, Y0 = 220, Y1 = 600;
  c.strokeStyle = '#22343e'; c.lineWidth = 2;
  for (let i = 0; i <= 4; i++) { const y = Y0 + (Y1 - Y0) * i / 4; c.beginPath(); c.moveTo(X0, y); c.lineTo(X1, y); c.stroke(); }
  c.fillStyle = '#6e8592'; c.font = '26px "IBM Plex Mono", monospace'; c.fillText('ΔIds/I0', X0, Y0 - 24); c.fillText('t', X1 - 14, Y1 + 28);
  const p = disp.state === 'done' ? 1 : disp.state === 'acq' ? disp.p : 0;
  const N = Math.floor(160 * p);
  const act = (i) => { const t = i / 160; return 0.62 / (1 + Math.exp(-(t - 0.35) * 12)) + 0.02 * Math.sin(i * 0.9) ; };
  const ref = (i) => 0.04 + 0.018 * Math.sin(i * 0.7 + 1);
  const Ym = (v) => Y1 - v * (Y1 - Y0) / 0.75;
  const plot = (f, col, lw) => { if (N < 2) return; c.strokeStyle = col; c.lineWidth = lw; c.beginPath(); for (let i = 0; i < N; i++) { const x = X0 + (X1 - X0) * i / 160; i ? c.lineTo(x, Ym(f(i))) : c.moveTo(x, Ym(f(i))); } c.stroke(); };
  plot(ref, '#5d7a8a', 4); plot(act, '#e3b456', 4); plot((i) => act(i) - ref(i) + 0.02, '#ff6b5e', 7);
  c.font = '500 26px "IBM Plex Mono", monospace';
  c.fillStyle = '#e3b456'; c.fillText('ATT', X0 + 10, Y1 + 50); c.fillStyle = '#5d7a8a'; c.fillText('RIF', X0 + 100, Y1 + 50); c.fillStyle = '#ff6b5e'; c.fillText('DIFF', X0 + 190, Y1 + 50);
  if (disp.state === 'acq') { c.fillStyle = '#1b2a32'; c.fillRect(40, 690, w - 80, 22); c.fillStyle = '#e3b456'; c.fillRect(40, 690, (w - 80) * p, 22); }
  if (disp.state === 'done') { c.fillStyle = '#e8eef1'; c.font = '700 46px "IBM Plex Mono", monospace'; c.fillText('Segnale diff. +' + (58.4).toFixed(1).replace('.', ',') + ' %', 40, 700); }
  if (disp.state === 'idle' || disp.state === 'ready') { c.fillStyle = '#6e8592'; c.font = '28px "IBM Plex Mono", monospace'; c.fillText('f lock-in 1 kHz · Vgs sweep pronto', 40, 700); }
  dispCanvasTex.needsUpdate = true;
}

/* ================================================================== views */
const VIEWS = {
  assembled: { cam: [150, 132, 214], tgt: [10, 8, 0], chipIn: true, cut: false, scene: 'macro',
    title: 'Lettore portatile con cartuccia inserita',
    spec: [['Formato', 'Palmare ~120 × 64 × 26 mm, uso al letto del paziente'], ['Slot', 'Fessura di precisione con 6 contatti a molla sui pad S/D/G'], ['Interfacce', 'Porta USB-C · indicatore Bluetooth Low Energy'], ['Lettura', 'Amperometrica / potenziometrica differenziale']] },
  chip: { cam: [22, 96, 172], tgt: [0, 30, 104], chipIn: false, cut: false, scene: 'macro',
    title: 'Chip biosensore monouso',
    spec: [['Substrato', 'Biopolimero flessibile (PLA o cellulosa) al posto del wafer di silicio'], ['Elettrodi', 'Source, Drain e Gate in lega Au/Cr (Cr di adesione + Au)'], ['Canale', 'Grafene monostrato, reticolo esagonale'], ['Differenziale', 'Canale attivo funzionalizzato + canale di riferimento passivato'], ['Campione', 'Porta di inoculo per una singola goccia ematica']] },
  cut: { cam: [70, 150, 170], tgt: [4, 6, 0], chipIn: true, cut: true, scene: 'macro',
    title: 'Spaccato del lettore',
    spec: [['SoC', 'Microcontrollore con radio BLE integrata, gestione e telemetria'], ['DSP', 'Filtraggio del segnale e amplificazione lock-in'], ['AFE', 'Front-end analogico per lettura amperometrica/potenziometrica'], ['J1', 'Connettore della cartuccia allineato al passo dei pad']] },
  nano: { cam: [84, 66, 118], tgt: [0, 14, 0], chipIn: true, cut: false, scene: 'nano',
    title: 'Zoom nanoscopico sul canale attivo',
    spec: [['Grafene', 'Monostrato sp², legame C–C 0,142 nm'], ['PBASE', 'Pirene ancorato per impilamento π–π, estere NHS per il legame covalente'], ['Recettori', 'Aptameri ssDNA/RNA sotto i 2 nm, così il legame avviene entro la lunghezza di Debye'], ['Bersaglio', 'Il legame del biomarcatore sposta la conduttanza del canale']] },
};
const POSE = {
  in: { pos: new V3(44, SLOT.y, 0), rot: new THREE.Euler(0, 0, 0) },
  out: { pos: new V3(-20, 30, 104), rot: new THREE.Euler(0.55, 0, 0) },
};
let view = 'assembled', tween = null, cutCurrent = 1000;
const ui = { flex: 0.55, explode: 0, sub: 'pla' };

function setView(v, instant = false) {
  view = v; const V = VIEWS[v];
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  document.getElementById('spec').innerHTML = `<h2>${V.title}</h2><dl>${V.spec.map(([k, d]) => `<dt>${k}</dt><dd>${d}</dd>`).join('')}</dl>`;
  const aspect = innerWidth / innerHeight;
  const far = aspect < 0.8 ? 1.75 : aspect < 1.2 ? 1.3 : 1;
  const tgt = new V3(...V.tgt), cam = new V3(...V.cam).sub(tgt).multiplyScalar(far).add(tgt);
  const from = { pos: chip.position.clone(), q: chip.quaternion.clone(), bend: chipState.bend, cam: camera.position.clone(), tgt: controls.target.clone(), cut: cutCurrent > 60 ? 60 : cutCurrent };
  const pose = V.chipIn ? POSE.in : POSE.out;
  tween = { t: 0, dur: instant || reduceMotion ? 0 : 1.2, from, to: { pos: pose.pos.clone(), q: new THREE.Quaternion().setFromEuler(pose.rot), bend: V.chipIn ? 0 : ui.flex, cam, tgt, cut: V.cut ? -4 : 60 }, sceneSwitch: V.scene };
  document.getElementById('flex').disabled = V.chipIn;
  if (disp.state === 'idle' || disp.state === 'ready') disp.state = V.chipIn ? 'ready' : 'idle';
}
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
let activeScene = macro;
function stepTween(dt) {
  if (!tween) return;
  tween.t = tween.dur ? Math.min(1, tween.t + dt / tween.dur) : 1;
  const k = ease(tween.t), { from, to } = tween;
  // scene switches halfway (or immediately for nano)
  if (tween.sceneSwitch === 'nano' && activeScene !== nanoScene) { activeScene = nanoScene; from.cam = to.cam.clone().multiplyScalar(2.2); from.tgt = to.tgt.clone(); }
  if (tween.sceneSwitch === 'macro' && activeScene !== macro) { activeScene = macro; from.cam = to.cam.clone().multiplyScalar(0.35); from.tgt = to.tgt.clone(); }
  chip.position.lerpVectors(from.pos, to.pos, k);
  chip.quaternion.slerpQuaternions(from.q, to.q, k);
  chipState.bend = THREE.MathUtils.lerp(from.bend, to.bend, k);
  camera.position.lerpVectors(from.cam, to.cam, k);
  controls.target.lerpVectors(from.tgt, to.tgt, k);
  applyBend(chipState.bend);
  cutCurrent = THREE.MathUtils.lerp(from.cut, to.cut, k);
  if (tween.t >= 1) { if (to.cut >= 60) cutCurrent = 1000; tween = null; }
  cutPlaneTop.constant = cutPlaneZ2.constant = cutCurrent;
}

function applyExplode() {
  const e = ui.explode;
  chipState.explode = e;
  gInside.position.y = 14 * e; gBand.position.y = 30 * e; gTop.position.y = 48 * e;
  const V = VIEWS[view];
  if (V.chipIn && !tween) chip.position.y = SLOT.y + 14 * e;
  layoutChip();
}
function setSubstrate(s) {
  ui.sub = s; substrate.material = s === 'pla' ? MAT.pla : MAT.cel;
  document.querySelectorAll('[data-sub]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.sub === s)));
}

/* ---------- test sequence: drop falls, capillary fill, lock-in acquisition ---------- */
let testT = -1;
function startTest() {
  testT = 0; dropState.t = 0; fluidSegs.forEach((m) => (m.material.opacity = 0));
  disp.state = VIEWS[view].chipIn ? 'acq' : 'idle'; disp.p = 0;
}
function stepTest(dt) {
  if (testT < 0) return;
  testT += dt;
  dropState.t = Math.min(1, testT / 0.7);
  const fillStart = 0.8;
  fluidSegs.forEach((m, i) => { const f = THREE.MathUtils.clamp((testT - fillStart - i * 0.45) / 0.45, 0, 1); m.material.opacity = 0.62 * f; });
  if (VIEWS[view].chipIn || disp.state === 'acq') {
    disp.state = 'acq'; disp.p = THREE.MathUtils.clamp((testT - 1.4) / 4.5, 0, 1);
    if (disp.p >= 1) disp.state = 'done';
  }
  if (testT > 6.2) testT = -1;
}

/* ---------- UI wiring ---------- */
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
document.querySelectorAll('[data-sub]').forEach((b) => b.addEventListener('click', () => setSubstrate(b.dataset.sub)));
document.getElementById('flex').addEventListener('input', (e) => { ui.flex = +e.target.value; if (!VIEWS[view].chipIn && !tween) { chipState.bend = ui.flex; applyBend(ui.flex); } });
document.getElementById('explode').addEventListener('input', (e) => { ui.explode = +e.target.value; applyExplode(); });
document.getElementById('opt-labels').addEventListener('change', (e) => { labelLayer.hidden = !e.target.checked; });
document.getElementById('opt-rotate').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
document.getElementById('btn-test').addEventListener('click', startTest);
const glbBtn = document.getElementById('btn-glb');
if (window.self === window.top) glbBtn.hidden = false;
glbBtn.addEventListener('click', async () => {
  glbBtn.disabled = true; glbBtn.textContent = 'Esportazione…';
  try {
    const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
    const root = activeScene === nanoScene ? nano : new THREE.Group().add(reader.clone(), chip.clone());
    const out = await new GLTFExporter().parseAsync(root, { binary: true });
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'model/gltf-binary' }));
    a.download = activeScene === nanoScene ? 'graheal_nanoscala.glb' : 'graheal_lettore_cartuccia.glb'; a.click();
    glbBtn.textContent = 'Esportato';
  } catch (err) { glbBtn.textContent = 'Esportazione non riuscita'; console.error(err); }
  setTimeout(() => { glbBtn.disabled = false; glbBtn.textContent = 'Esporta .glb'; }, 2500);
});

/* ---------- resize + render loop ---------- */
function resize() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const panel = document.getElementById('panel'), pr = panel.getBoundingClientRect();
  if (w > 720) camera.setViewOffset(w, h, -(pr.right / 2), 0, w, h);
  else camera.setViewOffset(w, h, 0, Math.min(pr.height, h * 0.44) / 2, w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const ray = new THREE.Raycaster(); const tmp = new V3();
let frame = 0;
function updateLabels() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  const occluders = frame % 8 === 0 ? [gTop, gBand, gBottom, chip] : null;
  for (const L of labels) {
    const on = L.view.includes(view) && !(view !== 'nano' && activeScene === nanoScene) && !(view === 'nano' && activeScene !== nanoScene);
    if (!on || tween) { L.el.style.display = 'none'; continue; }
    const p = L.getPos(); tmp.copy(p).project(camera);
    if (tmp.z > 1 || Math.abs(tmp.x) > 1.05 || Math.abs(tmp.y) > 1.05) { L.el.style.display = 'none'; continue; }
    L.el.style.display = '';
    const x = (tmp.x * 0.5 + 0.5) * w, y = (-tmp.y * 0.5 + 0.5) * h;
    L.el.style.transform = L.el.classList.contains('left') ? `translate(${x - L.el.offsetWidth + 3.5}px, ${y - 9}px)` : `translate(${x - 3.5}px, ${y - 9}px)`;
    if (occluders && L.occlude) {
      const dir = p.clone().sub(camera.position); const dist = dir.length(); ray.set(camera.position, dir.normalize()); ray.far = dist - 1.0;
      const hit = ray.intersectObjects(occluders, true).find((i) => !i.object.userData.section && i.object.visible);
      L.el.classList.toggle('dim', !!hit);
    }
  }
}

const clock = new THREE.Clock();
setSubstrate('pla'); setView('assembled', true); applyExplode(); applyBend(0); layoutChip();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now();
  stepTween(dt); stepTest(dt);
  layoutChip();
  // BLE LED breathing (fast blink while transmitting)
  const k = disp.state === 'acq' ? (Math.sin(now / 90) > 0 ? 1 : 0.1) : 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(now / 600));
  bleMat.emissiveIntensity = 0.3 + 2.4 * k;
  freeTargets.forEach((b, i) => { b.position.y = b.userData.y0 + Math.sin(now / 1400 + i * 2) * 2.2; b.rotation.y += dt * 0.15; });
  if (now - disp.last > 66) { drawDisplay(now); disp.last = now; }
  controls.update();
  renderer.render(activeScene, camera);
  updateLabels(); frame++;
  requestAnimationFrame(loop);
}
loop();
window.__graheal = { setView, startTest, ready: true };
</script>
